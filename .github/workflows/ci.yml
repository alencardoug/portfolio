name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      # Build primeiro: `next build` gera `.next/types/*` referenciados por
      # `next-env.d.ts`, sem os quais o `tsc` do passo seguinte falharia.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run check
